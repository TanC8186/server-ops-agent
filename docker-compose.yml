services:
  # ═══════════════════════════════════════════════════════════
  # Milvus 向量数据库（etcd + minio + standalone）
  # ═══════════════════════════════════════════════════════════
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.10
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 60s
      timeout: 20s
      retries: 3
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.5
    ports:
      - "8000:3000"
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      milvus:
        condition: service_healthy

  # ═══════════════════════════════════════════════════════════
  # On-Call Agent 主应用
  # ═══════════════════════════════════════════════════════════
  # 陈旧镜像陷阱（实测，见 docs/claude-code-handoff/DOCKER_ACCEPTANCE_2026-10-27.md）：
  # `docker compose up` 在本地已存在同名镜像时会**直接复用**它，不会因为 build:
  # 段存在就重建；于是就绪的容器可能跑着几天前的代码，验收结论却记到当前提交上。
  # 因此：
  #   - 重新验收当前提交前，先 `make docker-build-fresh`（--pull --no-cache），再
  #     `docker compose up -d --force-recreate app`；
  #   - 或者按 image id / digest 部署（`image: oncall-agent@sha256:...`）而不是
  #     让 compose 自行解析 tag；
  #   - 不要用 `latest` 作为验收对象：同名 tag 被覆盖后，无法从产物反推它对应哪个提交。
  # 这里不写 `image:` 字段是有意的——保持现有的「本地 build + 命名卷」默认行为不变，
  # 只把约束写清楚；改默认行为会让所有现存启动脚本同时改变语义。
  app:
    container_name: oncall-agent
    # 显式 image + build：这是 G8 P0 的修复。
    #
    # 原来只有 build:、没有 image:，compose 会把镜像名推导成
    # `on_call_agent-app:latest`；于是 `docker compose up -d --force-recreate`
    # 会直接复用本地同名镜像，新构建的 `oncall-agent:g8-final` 根本不会被采用，
    # 容器里跑的还是旧代码——这就是上面警告的"陈旧镜像陷阱"在 compose 层的形态。
    #
    # 默认值仍是原来的 `on_call_agent-app:latest`（不改变本地开发习惯），但验收时
    # 可以用环境变量钉到具体 tag 或 digest：
    #   APP_IMAGE=oncall-agent@sha256:<digest> docker compose up -d --force-recreate app
    # 这样"本次验收跑的到底是哪个镜像"不再取决于本地 latest 指向谁。
    image: ${APP_IMAGE:-on_call_agent-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9900:9900"
    # 配置注入契约（P0-02）：
    # 1) 宿主机 .env 只在运行时通过 env_file 注入，不烤进镜像
    #    （.dockerignore 已排除 .env）。required: false 表示没有 .env 也能起容器。
    # 2) 绝不写 `API_KEY=${API_KEY:-}` 这类空默认值：变量未设置时 compose 会把
    #    空字符串写进容器进程环境，而 pydantic-settings 的进程环境优先于 env_file，
    #    空值会静默覆盖挂载进来的真实密钥，让鉴权看起来开着其实关着。
    #    密钥只通过 .env 文件注入；确需用环境变量注入密钥的部署，
    #    请用下面的透传写法（`- API_KEY`，只写变量名），未设置时不注入空值。
    # 3) environment 优先级高于 env_file，用来覆盖容器内必须不同的值
    #    （HOST、Milvus/MCP 的容器网络地址）。
    # 需要 Docker Compose v2.24+（long syntax 的 required）。老版本请改用
    # `env_file: [.env]` 并确保 .env 存在。
    env_file:
      - path: .env
        required: false
    environment:
      # ── Milvus（Docker 内部网络地址） ──
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - MILVUS_TIMEOUT=10000

      # ── MCP 服务（同容器内 localhost） ──
      - MCP_CLS_TRANSPORT=streamable-http
      - MCP_CLS_URL=http://localhost:8003/mcp
      - MCP_MONITOR_TRANSPORT=streamable-http
      - MCP_MONITOR_URL=http://localhost:8004/mcp
      - MCP_SSH_TRANSPORT=streamable-http
      - MCP_SSH_URL=http://localhost:8005/mcp

      # ── Embedding 模型 ──
      - EMBEDDING_PROVIDER=local
      - EMBEDDING_MODEL=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      # 不要在这里写空 EMBEDDING_API_KEY：空值同样会覆盖 env_file 里的真实值。
      # 本地 embedding 不需要密钥；需要时只在 .env / 外部注入。
      - HF_ENDPOINT=https://hf-mirror.com

      # ── 以下从 .env 或宿主机环境继承 ──
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      # 密钥类变量用“透传式”（只写变量名）：存在于宿主环境时传入，
      # 未设置时不会向容器注入空字符串（否则会覆盖 env_file 里的真实值）。
      - LLM_API_KEY
      - LLM_BASE_URL=${LLM_BASE_URL:-https://www.autodl.art/api/v1/anthropic}
      - LLM_MODEL=${LLM_MODEL:-claude-sonnet-4-6}
      # 宿主模型服务使用容器可达地址，例如 http://host.docker.internal:8000/v1
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-qwen-ops}
      # AutoDL SSH 目标的专用模型名（留空 = 所有目标都用 LOCAL_LLM_MODEL）。
      # 两个模型共用同一个 LOCAL_LLM_BASE_URL，靠 vLLM 的 served-model-name 区分；
      # 不在这里写空默认值，未设置时不注入，保持“只有一个端点”的契约。
      - LOCAL_LLM_MODEL_SSH
      - LOCAL_LLM_WITH_PARAMS=${LOCAL_LLM_WITH_PARAMS:-False}
      - LOCAL_LLM_MAX_TOKENS=${LOCAL_LLM_MAX_TOKENS:-768}
      - DIAGNOSTIC_TIMEOUT_SECONDS=${DIAGNOSTIC_TIMEOUT_SECONDS:-180}
      - DIAGNOSTIC_TOOL_TIMEOUT_SECONDS=${DIAGNOSTIC_TOOL_TIMEOUT_SECONDS:-20}
      - DIAGNOSTIC_MAX_TOOL_CALLS=${DIAGNOSTIC_MAX_TOOL_CALLS:-10}
      - TENCENTCLOUD_SECRET_ID
      - TENCENTCLOUD_SECRET_KEY
      - TENCENTCLOUD_REGION=${TENCENTCLOUD_REGION:-ap-beijing}
      - SSH_HOST=${SSH_HOST:-}
      - SSH_PORT=${SSH_PORT:-22}
      - SSH_USER=${SSH_USER:-Administrator}
      # SSH_KEY_FILE 有两种语义，必须分开：
      #   宿主侧：作为 volumes 的源路径（compose 执行于宿主）
      #   容器内：服务进程读的路径，固定是挂载目标
      # 旧写法 `SSH_KEY_FILE=${SSH_KEY_FILE:-...}` 会把宿主路径原样
      # 传进容器：宿主写 `E:/...` 时容器内找不到该文件，
      # SSH 工具直接报 ENOENT。挂载目标不变，所以容器内固定为 /app/ssh_key.pem。
      - SSH_KEY_FILE=/app/ssh_key.pem
      - SSH_SERVER_TYPE=${SSH_SERVER_TYPE:-windows}
      # 无云凭证时的合成数据开关；0 = 直接报 unavailable
      - DEMO_MODE=${DEMO_MODE:-0}

      # 密钥只透传变量名，不写空默认值：宿主 shell 里有 API_KEY 就传入，
      # 没有就不注入任何值（不会用空串覆盖 .env 里的真实密钥）。
      # 常规情况下密钥来自上面 env_file 挂载的 .env。
      - API_KEY

      # ── 监听地址与访问控制 ──
      # 宿主机运行时默认只绑 127.0.0.1（安全的默认值）；容器内部不同：
      # 必须显式监听 0.0.0.0，否则端口映射打不进容器。这是容器内的硬性覆盖，
      # 不会影响宿主机/本地运行的默认值。改端口请同时改上面的 ports。
      - HOST=0.0.0.0
      - PORT=9900
      # 容器用独立变量 CONTAINER_AUTH_MODE 表达“是否对外提供未鉴权服务”，默认
      # fail closed（deployment）：没有 API_KEY 时 startup_check() 直接拒绝启动。
      # 不直接引用 AUTH_MODE，是因为 compose 会自动加载 .env 做插值——开发用
      # .env（AUTH_MODE=dev）会让容器悄悄失去鉴权。environment 优先于 env_file，
      # 所以这里的默认值无法被 .env 覆盖；要跑未鉴权的演示容器必须显式
      # `CONTAINER_AUTH_MODE=dev docker compose up`。
      # 密钥只从 .env / 外部注入，绝不在 compose 里写空默认值。
      - AUTH_MODE=${CONTAINER_AUTH_MODE:-deployment}
      # CORS 来源同样来自配置（逗号分隔），默认只允许本机前端，不要用 *
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:9900,http://127.0.0.1:9900}
    volumes:
      # 挂载 HuggingFace 模型缓存（避免重复下载）
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface:rw
      # 挂载 SSH 私钥（如不需要 SSH 功能可删除此行）
      - ${SSH_KEY_FILE:-/dev/null}:/app/ssh_key.pem:ro
      # 服务清单：以前只有构建时 COPY，换诊断目标就得重建 10.7GB 镜像。
      # 挂载进去之后，换目标只需改宿主文件 + 重启容器。必须 :ro。
      - ${AIOPS_SERVICES_HOST_FILE:-./services.json}:/app/services.json:ro
      # ── 命名卷：容器重建后数据仍在 ──
      # uploads/：上传的原始文档（app/api/file.py 的 ./uploads）
      - oncall-uploads:/app/uploads
      # logs/：应用日志与 logs/traces/*.jsonl（app/observability.py）
      - oncall-logs:/app/logs
      # eval/results/：评测产物（scripts/run_eval.py、/api/runs/eval/results）
      - oncall-eval-results:/app/eval/results
      # data/：embedding 描述符等知识库元数据（vector_store_manager.DESCRIPTOR_FILE）
      # 描述符丢失会让已有 collection 被判为 invalid_index，必须持久化。
      - oncall-data:/app/data
    depends_on:
      # 冷启动策略：**软依赖**，只保证启动顺序，不以 Milvus healthy 作硬门槛。
      # 与 docker-entrypoint.sh 的降级策略一致：Milvus 慢或暂不可用时，诊断主
      # 链路（不依赖向量库）先起来，RAG 在 /health 里如实显示 unavailable，依赖
      # 恢复后由 VectorStoreManager 的 transient 重试自行恢复，无需重启容器。
      # 旧配置用 service_healthy，与 entrypoint 的矛盾策略会让 app 在 Milvus 冷
      # 启动慢时直接起不来，把“RAG 暂时不可用”伪装成“app 启动失败”。
      milvus:
        condition: service_started
    # 容器健康状态以 /health 为准：该接口在 Milvus/RAG 故障时仍返回 200，
    # 表示"进程可用、能力可能降级"；只有进程本身不可用时才 unhealthy。
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:9900/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  # 四个命名卷都由 Docker 管理，`docker compose down -v` 会连同数据一起删除；
  # 普通 `docker compose down` 保留。备份/恢复步骤见 docs/DEPLOYMENT.md。
  oncall-uploads:
    name: oncall-agent-uploads
  oncall-logs:
    name: oncall-agent-logs
  oncall-eval-results:
    name: oncall-agent-eval-results
  oncall-data:
    name: oncall-agent-data

networks:
  default:
    name: oncall-agent-net
